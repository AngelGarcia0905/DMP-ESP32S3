; Firmware SOLO para ESP32-S3 (N16R8, USB-C UART/COM, chip CH343). Este es el unico proyecto activo de DMP.
;   pio run -t upload
;   pio device monitor
; lib/DmpCore va dentro del proyecto (ruta relativa) porque la ruta tiene acento ("Leon").
[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Sin upload_port / monitor_port: PlatformIO detecta el puerto de la placa conectada. Si hay varios dispositivos USB y elige otro,
; escribir aqui el puerto (por ejemplo upload_port = COM21 y monitor_port = COM21) o usar: pio run -t upload --upload-port COM21
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; -Iinclude permite que lib/DmpCore encuentre include/secrets.h (las librerias no ven el include/ del proyecto).
build_flags = -DCORE_DEBUG_LEVEL=0 -Iinclude
build_src_filter = -<*>

; Firmware completo (por defecto): ejes, sensores, laser, LED de estado, pantalla y perilla. SIN interfaz web: todo se hace
; desde la pantalla TFT y la perilla (el codigo del panel web quedo archivado en _web_removida/, fuera de la compilacion).
[env:esp32s3]
build_src_filter = ${env.build_src_filter} +<main.cpp>
; Pantalla TFT de la interfaz (lib/DmpCore/src/Ui.cpp)
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; Pantalla TFT ST7735 128x160 por SPI (SCK 12, MOSI 11, CS 10, DC 13, RES 21): colores y texto.
;   pio run -e tft_test -t upload
[env:tft_test]
build_src_filter = ${env.build_src_filter} +<step12_tft_test.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; Interfaz de la pantalla estilo impresora 3D (blanco sobre negro, menu en cuadricula, perilla KY-040).
; Prueba suelta: la posicion se simula, no mueve motores.
;   pio run -e tft_ui -t upload
[env:tft_ui]
build_src_filter = ${env.build_src_filter} +<step14_tft_ui.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; Terminal de G-code en la pantalla TFT (se escribe desde el monitor serie; no mueve motores).
;   pio run -e tft_gcode -t upload
[env:tft_gcode]
build_src_filter = ${env.build_src_filter} +<step13_tft_gcode.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
